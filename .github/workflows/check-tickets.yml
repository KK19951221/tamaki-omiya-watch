name: Check Tamaki Omiya Tickets

on:
  workflow_dispatch: {}
  # 保険として15分おきのスケジュールも仕込んでおく
  # (cron-job.org 側が止まっても最低限これが動く)
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run ticket check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_tickets.py

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state: notified"
            git push
          else
            echo "state.json に変更なし"
          fi
